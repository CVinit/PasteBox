name: ${INFRA_COMPOSE_PROJECT_NAME:-infra}

services:
  postgres:
    image: ${POSTGRESQL_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRESQL_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRESQL_HOST_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - postgresql-backups:/backups
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_timeout=${POSTGRESQL_WAL_ARCHIVE_TIMEOUT_SECONDS:-900}"
      - "-c"
      - "archive_command=mkdir -p /backups/wal && test ! -f /backups/wal/%f && cp %p /backups/wal/%f || test -f /backups/wal/%f"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      infra:
        aliases:
          - postgresql
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      infra:
        aliases:
          - redis
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  infra:
    name: infra-net
    ipam:
      config:
        - subnet: ${INFRA_NETWORK_SUBNET:-172.30.0.0/24}

volumes:
  postgresql-data:
    name: ${POSTGRESQL_VOLUME:-postgresql-data}
  redis-data:
    name: ${REDIS_VOLUME:-redis-data}
  postgresql-backups:
    external: true
    name: ${POSTGRESQL_BACKUP_VOLUME:-postgresql-backups}
