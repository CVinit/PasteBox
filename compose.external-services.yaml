services:
  api:
    depends_on:
      postgres: !reset null
      redis: !reset null
    networks:
      - default
      - infra
    environment:
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}

  worker:
    depends_on:
      postgres: !reset null
      redis: !reset null
    networks:
      - default
      - infra
    environment:
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}

  migrate:
    depends_on:
      postgres: !reset null
    networks:
      - default
      - infra
    environment:
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}

  preflight:
    networks:
      - default
      - infra
    environment:
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}

  postgres-backup:
    depends_on:
      postgres: !reset null
    environment:
      PGHOST: postgresql
      PGUSER: ${POSTGRESQL_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
    networks:
      - default
      - infra

  postgres-basebackup:
    depends_on:
      postgres: !reset null
    environment:
      PGHOST: postgresql
      PGUSER: ${POSTGRESQL_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
    networks:
      - default
      - infra

  postgres-wal-check:
    depends_on:
      postgres: !reset null
    environment:
      PGHOST: postgresql
      PGUSER: ${POSTGRESQL_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
    networks:
      - default
      - infra

  postgres-restore-drill:
    depends_on:
      postgres: !reset null
    environment:
      PGHOST: postgresql
      PGUSER: ${POSTGRESQL_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}
    networks:
      - default
      - infra

  postgres-pitr-drill:
    environment:
      PGUSER: ${POSTGRESQL_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}

  postgres:
    profiles: ["integrated-infra"]
    depends_on:
      backup-volume-init:
        condition: service_completed_successfully

  redis:
    profiles: ["integrated-infra"]

  backup-volume-init:
    profiles: ["integrated-infra"]

networks:
  infra:
    external: true
    name: infra-net

volumes:
  pastebox-backups:
    external: true
    name: ${POSTGRESQL_BACKUP_VOLUME:-postgresql-backups}
