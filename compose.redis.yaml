name: redis

services:
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      redis:
        aliases:
          - redis
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  redis:
    name: ${REDIS_NETWORK:-redis-net}
    ipam:
      config:
        - subnet: ${REDIS_NETWORK_SUBNET:-172.31.0.0/24}

volumes:
  redis-data:
    name: ${REDIS_VOLUME:-redis-data}
