name: pastebox

services:
  api:
    image: ${PASTEBOX_IMAGE:?set PASTEBOX_IMAGE to a pinned ghcr.io/cvinit/pastebox:sha-* tag or digest}
    command: ["api"]
    restart: unless-stopped
    env_file:
      - ${PASTEBOX_ENV_FILE:-./deploy/production.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    image: ${PASTEBOX_IMAGE:?set PASTEBOX_IMAGE to a pinned ghcr.io/cvinit/pastebox:sha-* tag or digest}
    command: ["worker"]
    restart: unless-stopped
    env_file:
      - ${PASTEBOX_ENV_FILE:-./deploy/production.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backup-volume-init:
    image: ${PASTEBOX_POSTGRES_IMAGE:-postgres:17-alpine}
    command: ["sh", "-c", "mkdir -p /backups/postgres /backups/basebackups /backups/wal && chown -R postgres:postgres /backups"]
    volumes:
      - pastebox-backups:/backups

  postgres:
    image: ${PASTEBOX_POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PASTEBOX_POSTGRES_DB:-pastebox}
      POSTGRES_USER: ${PASTEBOX_POSTGRES_USER:-pastebox}
      POSTGRES_PASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}
    volumes:
      - pastebox-postgres:/var/lib/postgresql/data
      - pastebox-backups:/backups
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    depends_on:
      backup-volume-init:
        condition: service_completed_successfully
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_timeout=${PASTEBOX_WAL_ARCHIVE_TIMEOUT_SECONDS:-900}"
      - "-c"
      - "archive_command=mkdir -p /backups/wal && test ! -f /backups/wal/%f && cp %p /backups/wal/%f || test -f /backups/wal/%f"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: ${PASTEBOX_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - pastebox-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  clamav:
    image: ${PASTEBOX_CLAMAV_IMAGE:-clamav/clamav:1.4}
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - pastebox-clamav:/var/lib/clamav
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: ${PASTEBOX_CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    env_file:
      - ${PASTEBOX_ENV_FILE:-./deploy/production.env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - pastebox-caddy-data:/data
      - pastebox-caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  preflight:
    image: ${PASTEBOX_IMAGE:?set PASTEBOX_IMAGE to a pinned ghcr.io/cvinit/pastebox:sha-* tag or digest}
    command: ["preflight", "production"]
    profiles: ["maintenance"]
    env_file:
      - ${PASTEBOX_ENV_FILE:-./deploy/production.env}

  migrate:
    image: ${PASTEBOX_IMAGE:?set PASTEBOX_IMAGE to a pinned ghcr.io/cvinit/pastebox:sha-* tag or digest}
    command: ["migrate", "up"]
    profiles: ["maintenance"]
    env_file:
      - ${PASTEBOX_ENV_FILE:-./deploy/production.env}
    depends_on:
      postgres:
        condition: service_healthy

  postgres-backup:
    image: ${PASTEBOX_POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: ["maintenance"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${PASTEBOX_POSTGRES_DB:-pastebox}
      PGUSER: ${PASTEBOX_POSTGRES_USER:-pastebox}
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}
      PASTEBOX_BACKUP_RETENTION_DAYS: ${PASTEBOX_BACKUP_RETENTION_DAYS:-30}
    volumes:
      - pastebox-backups:/backups
      - ./deploy/backup/postgres-backup.sh:/usr/local/bin/pastebox-postgres-backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/pastebox-postgres-backup.sh"]

  postgres-basebackup:
    image: ${PASTEBOX_POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: ["maintenance"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${PASTEBOX_POSTGRES_DB:-pastebox}
      PGUSER: ${PASTEBOX_POSTGRES_USER:-pastebox}
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}
      PASTEBOX_BACKUP_RETENTION_DAYS: ${PASTEBOX_BACKUP_RETENTION_DAYS:-30}
      PASTEBOX_WAL_ARCHIVE_MAX_AGE_SECONDS: ${PASTEBOX_WAL_ARCHIVE_MAX_AGE_SECONDS:-900}
      PASTEBOX_WAL_ARCHIVE_WAIT_SECONDS: ${PASTEBOX_WAL_ARCHIVE_WAIT_SECONDS:-60}
    volumes:
      - pastebox-backups:/backups
      - ./deploy/backup/postgres-basebackup.sh:/usr/local/bin/pastebox-postgres-basebackup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/pastebox-postgres-basebackup.sh"]

  postgres-wal-check:
    image: ${PASTEBOX_POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: ["maintenance"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${PASTEBOX_POSTGRES_DB:-pastebox}
      PGUSER: ${PASTEBOX_POSTGRES_USER:-pastebox}
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}
      PASTEBOX_WAL_ARCHIVE_MAX_AGE_SECONDS: ${PASTEBOX_WAL_ARCHIVE_MAX_AGE_SECONDS:-900}
      PASTEBOX_WAL_ARCHIVE_WAIT_SECONDS: ${PASTEBOX_WAL_ARCHIVE_WAIT_SECONDS:-60}
    volumes:
      - pastebox-backups:/backups
      - ./deploy/backup/postgres-wal-check.sh:/usr/local/bin/pastebox-postgres-wal-check.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/pastebox-postgres-wal-check.sh"]

  postgres-restore-drill:
    image: ${PASTEBOX_POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: ["maintenance"]
    environment:
      PGHOST: postgres
      PGDATABASE: postgres
      PGUSER: ${PASTEBOX_POSTGRES_USER:-pastebox}
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}
      PASTEBOX_RESTORE_SOURCE: ${PASTEBOX_RESTORE_SOURCE:-}
      PASTEBOX_RESTORE_DRILL_DATABASE: ${PASTEBOX_RESTORE_DRILL_DATABASE:-pastebox_restore_drill}
      PASTEBOX_KEEP_RESTORE_DRILL_DB: ${PASTEBOX_KEEP_RESTORE_DRILL_DB:-false}
    volumes:
      - pastebox-backups:/backups
      - ./deploy/backup/postgres-restore-drill.sh:/usr/local/bin/pastebox-postgres-restore-drill.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/pastebox-postgres-restore-drill.sh"]

  postgres-pitr-drill:
    image: ${PASTEBOX_POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: ["maintenance"]
    environment:
      PGDATABASE: ${PASTEBOX_POSTGRES_DB:-pastebox}
      PGUSER: ${PASTEBOX_POSTGRES_USER:-pastebox}
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}
      PASTEBOX_PITR_SOURCE_BASE: ${PASTEBOX_PITR_SOURCE_BASE:-}
      PASTEBOX_PITR_TARGET_TIME: ${PASTEBOX_PITR_TARGET_TIME:-}
      PASTEBOX_PITR_DRILL_DATABASE: ${PASTEBOX_PITR_DRILL_DATABASE:-}
      PASTEBOX_PITR_DRILL_PORT: ${PASTEBOX_PITR_DRILL_PORT:-55432}
      PASTEBOX_PITR_RECOVERY_WAIT_SECONDS: ${PASTEBOX_PITR_RECOVERY_WAIT_SECONDS:-300}
      PASTEBOX_KEEP_PITR_DRILL_DIR: ${PASTEBOX_KEEP_PITR_DRILL_DIR:-false}
    volumes:
      - pastebox-backups:/backups
      - ./deploy/backup/postgres-pitr-restore-drill.sh:/usr/local/bin/pastebox-postgres-pitr-restore-drill.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/pastebox-postgres-pitr-restore-drill.sh"]

  backup-push:
    image: ${PASTEBOX_RESTIC_IMAGE:-restic/restic:0.18.1}
    profiles: ["maintenance"]
    environment:
      RESTIC_REPOSITORY: ${PASTEBOX_RESTIC_REPOSITORY:?set PASTEBOX_RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${PASTEBOX_RESTIC_PASSWORD:?set PASTEBOX_RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${PASTEBOX_BACKUP_S3_ACCESS_KEY:?set PASTEBOX_BACKUP_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${PASTEBOX_BACKUP_S3_SECRET_KEY:?set PASTEBOX_BACKUP_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${PASTEBOX_BACKUP_S3_REGION:-us-east-1}
    volumes:
      - pastebox-backups:/backups:ro
      - ./deploy/backup/restic-backup.sh:/usr/local/bin/pastebox-restic-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/pastebox-restic-backup.sh"]

volumes:
  pastebox-postgres:
  pastebox-redis:
  pastebox-clamav:
  pastebox-caddy-data:
  pastebox-caddy-config:
  pastebox-backups:
