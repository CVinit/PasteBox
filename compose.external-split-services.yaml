services:
  api:
    networks:
      - default
      - postgresql
      - redis
    environment:
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}

  worker:
    networks:
      - default
      - postgresql
      - redis
    environment:
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}

  migrate:
    networks:
      - default
      - postgresql
      - redis
    environment:
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}

  preflight:
    networks:
      - default
      - postgresql
      - redis
    environment:
      PGPASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:?set PASTEBOX_POSTGRES_PASSWORD}

  postgres-backup:
    networks:
      - default
      - postgresql

  postgres-basebackup:
    networks:
      - default
      - postgresql

  postgres-wal-check:
    networks:
      - default
      - postgresql

  postgres-restore-drill:
    networks:
      - default
      - postgresql

  postgres-pitr-drill:
    environment:
      PGUSER: ${POSTGRESQL_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRESQL_PASSWORD:?set POSTGRESQL_PASSWORD}

networks:
  postgresql:
    external: true
    name: ${POSTGRESQL_NETWORK:-postgresql-net}
  redis:
    external: true
    name: ${REDIS_NETWORK:-redis-net}

volumes:
  pastebox-backups:
    external: true
    name: ${POSTGRESQL_BACKUP_VOLUME:-postgresql-backups}
