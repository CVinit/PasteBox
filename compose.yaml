services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pastebox
      POSTGRES_USER: pastebox
      POSTGRES_PASSWORD: pastebox
    ports:
      - "5432:5432"
    volumes:
      - pastebox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastebox -d pastebox"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pastebox-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pastebox
      MINIO_ROOT_PASSWORD: pastebox-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pastebox-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 pastebox pastebox-secret
        mc mb --ignore-existing local/pastebox

  clamav:
    image: ${PASTEBOX_CLAMAV_IMAGE:-clamav/clamav-debian:1.4}
    ports:
      - "3310:3310"
    volumes:
      - pastebox-clamav:/var/lib/clamav

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pastebox-postgres:
  pastebox-redis:
  pastebox-minio:
  pastebox-clamav:
