name: pastebox-demo

x-pastebox-env: &pastebox-env
  PASTEBOX_APP_ENV: ${PASTEBOX_APP_ENV:-development}
  PASTEBOX_HTTP_ADDR: :8080
  PASTEBOX_CONFIG_ENCRYPTION_KEY: ${PASTEBOX_CONFIG_ENCRYPTION_KEY:-}
  PASTEBOX_METRICS_TOKEN: ${PASTEBOX_METRICS_TOKEN:-demo-metrics-token-change-me}
  PASTEBOX_DATABASE_URL: postgres://pastebox:${PASTEBOX_POSTGRES_PASSWORD:-pastebox-demo-password}@postgres:5432/pastebox?sslmode=disable
  PASTEBOX_REDIS_ADDR: redis:6379

services:
  pastebox:
    image: ${PASTEBOX_IMAGE:?set PASTEBOX_IMAGE to ghcr.io/cvinit/pastebox:sha-* or a digest}
    command: ["api"]
    restart: unless-stopped
    ports:
      - "${PASTEBOX_HTTP_PORT:-8080}:8080"
    environment: *pastebox-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: ${PASTEBOX_IMAGE:?set PASTEBOX_IMAGE to ghcr.io/cvinit/pastebox:sha-* or a digest}
    command: ["worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    environment: *pastebox-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      mailpit:
        condition: service_started

  migrate:
    image: ${PASTEBOX_IMAGE:?set PASTEBOX_IMAGE to ghcr.io/cvinit/pastebox:sha-* or a digest}
    command: ["migrate", "up"]
    environment: *pastebox-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${PASTEBOX_POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: pastebox
      POSTGRES_USER: pastebox
      POSTGRES_PASSWORD: ${PASTEBOX_POSTGRES_PASSWORD:-pastebox-demo-password}
    volumes:
      - pastebox-demo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${PASTEBOX_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - pastebox-demo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${PASTEBOX_MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pastebox
      MINIO_ROOT_PASSWORD: pastebox-secret
    volumes:
      - pastebox-demo-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${PASTEBOX_MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 pastebox pastebox-secret
        mc mb --ignore-existing local/pastebox

  clamav:
    image: ${PASTEBOX_CLAMAV_IMAGE:-clamav/clamav-debian:1.4}
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - pastebox-demo-clamav:/var/lib/clamav

  mailpit:
    image: ${PASTEBOX_MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    restart: unless-stopped
    expose:
      - "1025"
    ports:
      - "${PASTEBOX_MAILPIT_HTTP_PORT:-18025}:8025"

volumes:
  pastebox-demo-postgres:
  pastebox-demo-redis:
  pastebox-demo-minio:
  pastebox-demo-clamav:
