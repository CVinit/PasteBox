services:
  pastebox:
    image: ${PASTEBOX_IMAGE:?set PASTEBOX_IMAGE to ghcr.io/cvinit/pastebox:sha-* or a digest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PASTEBOX_APP_ENV: production
      PASTEBOX_APP_NAME: PasteBox
      PASTEBOX_HTTP_ADDR: :8080
      PASTEBOX_PUBLIC_URL: ${PASTEBOX_PUBLIC_URL:?set the public HTTPS URL}
      PASTEBOX_CSRF_SECRET: ${PASTEBOX_CSRF_SECRET:?set a long random CSRF signing secret}
      PASTEBOX_MAILER_PROVIDER: log
      PASTEBOX_STRIPE_ENABLED: "false"
      PASTEBOX_EPUSDT_ENABLED: "false"
      PASTEBOX_BOOTSTRAP_ADMIN_EMAIL: ${PASTEBOX_BOOTSTRAP_ADMIN_EMAIL:?set bootstrap admin email}
      PASTEBOX_BOOTSTRAP_ADMIN_PASSWORD: ${PASTEBOX_BOOTSTRAP_ADMIN_PASSWORD:?set bootstrap admin password}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
