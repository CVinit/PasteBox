# PasteBox production PostgreSQL authentication rules.
#
# The application and maintenance jobs run on the Compose network and must use
# password authentication. PITR base backups also need a replication entry so
# pg_basebackup can connect from the maintenance container.
local all all trust
host all all 127.0.0.1/32 scram-sha-256
host all all ::1/128 scram-sha-256
host all all samenet scram-sha-256
host replication all samenet scram-sha-256
