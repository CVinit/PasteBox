global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/pastebox-alerts.yml

scrape_configs:
  - job_name: pastebox-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/pastebox_metrics_token
    static_configs:
      - targets:
          - api:8080

  - job_name: pastebox-caddy
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - caddy:2019

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: pastebox-https
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - __PASTEBOX_PUBLIC_URL__
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
