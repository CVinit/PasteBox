global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/pastebox-alerts.yml

scrape_configs:
  - job_name: pastebox-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/pastebox_metrics_token
    static_configs:
      - targets:
          - api:8080
